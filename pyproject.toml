[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-discovery"
version = "0.2.0"
description = "Cross-disciplinary scientific problem structure discovery infrastructure."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "rich>=13,<15",
    "sqlalchemy>=2.0,<3",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
]

[project.scripts]
discovery = "discovery.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["discovery"]
